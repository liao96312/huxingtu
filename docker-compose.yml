services:
  api:
    build: .
    command: ["sh", "-c", "python -m pano_platform.migrate && uvicorn pano_platform.main:app --app-dir backend --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql://pano:pano@postgres:5432/pano
      REDIS_URL: redis://redis:6379/0
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15.10-alpine
    environment:
      POSTGRES_DB: pano
      POSTGRES_USER: pano
      POSTGRES_PASSWORD: pano
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pano -d pano"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
